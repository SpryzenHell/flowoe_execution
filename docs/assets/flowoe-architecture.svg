<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-opacity=".18"/>
    </filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0 0 L11 5.5 L0 11 Z" fill="#51606f"/>
    </marker>
  </defs>

  <rect width="1400" height="760" fill="#0e1726"/>
  <text x="70" y="72" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#f8fafc">FlowOE Execution</text>
  <text x="70" y="108" font-family="Arial, sans-serif" font-size="18" fill="#a9b7c7">Data → features → policy → replay → measurement</text>

  <g filter="url(#shadow)">
    <rect x="55" y="160" width="235" height="250" rx="22" fill="#ffffff"/>
    <rect x="55" y="160" width="235" height="58" rx="22" fill="#dbeafe"/>
    <text x="172" y="197" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#16324f">1 · Data</text>
    <text x="82" y="260" font-family="Arial" font-size="17" fill="#26384d">
      <tspan x="82" dy="0">FI-2010</tspan>
      <tspan x="82" dy="26">144 features + 5 labels</tspan>
      <tspan x="82" dy="42">Top-10 crypto L2</tspan>
      <tspan x="82" dy="26">Trade prints</tspan>
    </text>
  </g>

  <g filter="url(#shadow)">
    <rect x="320" y="160" width="235" height="250" rx="22" fill="#ffffff"/>
    <rect x="320" y="160" width="235" height="58" rx="22" fill="#dcfce7"/>
    <text x="437" y="197" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#183b27">2 · Features</text>
    <text x="347" y="260" font-family="Arial" font-size="17" fill="#26384d">
      <tspan x="347" dy="0">45-value L2 vector</tspan>
      <tspan x="347" dy="30">Price levels</tspan>
      <tspan x="347" dy="28">Depth + imbalance</tspan>
      <tspan x="347" dy="28">Spread + volatility</tspan>
    </text>
  </g>

  <g filter="url(#shadow)">
    <rect x="585" y="160" width="235" height="250" rx="22" fill="#ffffff"/>
    <rect x="585" y="160" width="235" height="58" rx="22" fill="#fef3c7"/>
    <text x="702" y="197" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#5b4211">3 · Policy</text>
    <text x="612" y="260" font-family="Arial" font-size="17" fill="#26384d">
      <tspan x="612" dy="0">CFM vector field</tspan>
      <tspan x="612" dy="30">RK4 sampling</tspan>
      <tspan x="612" dy="28">PF-ODE comparison</tspan>
      <tspan x="612" dy="28">Schedule = softmax</tspan>
    </text>
  </g>

  <g filter="url(#shadow)">
    <rect x="850" y="160" width="235" height="250" rx="22" fill="#ffffff"/>
    <rect x="850" y="160" width="235" height="58" rx="22" fill="#fce7f3"/>
    <text x="967" y="197" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#54263f">4 · Replay</text>
    <text x="877" y="260" font-family="Arial" font-size="17" fill="#26384d">
      <tspan x="877" dy="0">Child orders over time</tspan>
      <tspan x="877" dy="30">Walk price levels</tspan>
      <tspan x="877" dy="28">Allow partial fills</tspan>
      <tspan x="877" dy="28">Track completion</tspan>
    </text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1115" y="160" width="235" height="250" rx="22" fill="#ffffff"/>
    <rect x="1115" y="160" width="235" height="58" rx="22" fill="#ede9fe"/>
    <text x="1232" y="197" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#3e2d68">5 · Measure</text>
    <text x="1142" y="260" font-family="Arial" font-size="17" fill="#26384d">
      <tspan x="1142" dy="0">Trade VWAP</tspan>
      <tspan x="1142" dy="30">TWAP baseline</tspan>
      <tspan x="1142" dy="28">Slippage in bps</tspan>
      <tspan x="1142" dy="28">Mean / median / p95</tspan>
    </text>
  </g>

  <line x1="290" y1="285" x2="314" y2="285" stroke="#8fa0b2" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="555" y1="285" x2="579" y2="285" stroke="#8fa0b2" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="820" y1="285" x2="844" y2="285" stroke="#8fa0b2" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="1085" y1="285" x2="1109" y2="285" stroke="#8fa0b2" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="250" y="470" width="900" height="190" rx="24" fill="#172235" stroke="#334155" stroke-width="2"/>
  <text x="290" y="515" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#f8fafc">Acceleration branch</text>
  <text x="290" y="555" font-family="Arial, sans-serif" font-size="17" fill="#c2cedb">Fixed-step sampling keeps the inference loop simple to convert and benchmark.</text>

  <rect x="290" y="585" width="235" height="52" rx="14" fill="#1e3a5f"/>
  <text x="407" y="618" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#e8f1fb">Fixed-step sampler</text>
  <rect x="582" y="585" width="235" height="52" rx="14" fill="#1f4a37"/>
  <text x="699" y="618" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#e7f8ec">INT8 TensorRT</text>
  <rect x="874" y="585" width="235" height="52" rx="14" fill="#5a3a17"/>
  <text x="991" y="618" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#fff2dc">Fused CUDA update</text>

  <line x1="407" y1="470" x2="407" y2="455" stroke="#8fa0b2" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="699" y1="470" x2="699" y2="455" stroke="#8fa0b2" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="991" y1="470" x2="991" y2="455" stroke="#8fa0b2" stroke-width="3" marker-end="url(#arrow)"/>

  <text x="70" y="710" font-family="Arial, sans-serif" font-size="16" fill="#91a0b1">Real-data evaluation uses the same execution windows for the strategy and benchmark.</text>
</svg>
