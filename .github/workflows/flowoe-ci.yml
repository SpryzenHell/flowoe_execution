name: FlowOE CI
on:
  push:
    paths: ['src/flowoe_execution/**','scripts/**','tests/**','pyproject.toml']
  pull_request:
    paths: ['src/flowoe_execution/**','scripts/**','tests/**','pyproject.toml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: python -m pytest -q
      - run: python scripts/run_experiment.py --smoke --epochs 12
